      - service.app:create_app
      - '--factory'
      - '--host'
      - 0.0.0.0
      - '--port'
      - '8000'
      - '--workers'
      - '1'
      - '--no-access-log'
      - '--limit-concurrency'
      - '8'
      - '--timeout-keep-alive'
      - '5'
    environment:
      PROCESSOR_TOKEN_FILE: /run/secrets/processor_token
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set an operator-approved locally imported model name}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-32}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-64}
      MAX_PAGE_EXTRACTIONS: ${MAX_PAGE_EXTRACTIONS:-2}
      VISUAL_PAGES_ENABLED: ${VISUAL_PAGES_ENABLED:-true}
      MAX_VISUAL_PAGES: ${MAX_VISUAL_PAGES:-6}
      MAX_VISUAL_BYTES: ${MAX_VISUAL_BYTES:-8388608}
      MAX_NESTED_EML_DEPTH: ${MAX_NESTED_EML_DEPTH:-3}
      MAX_EMAIL_PARTS: ${MAX_EMAIL_PARTS:-32}
      MAX_EMAIL_ATTACHMENTS: ${MAX_EMAIL_ATTACHMENTS:-8}
      DOCUMENT_DECODE_TIMEOUT_SECONDS: ${DOCUMENT_DECODE_TIMEOUT_SECONDS:-75}
      ALLOW_CLOUD_ENGINES: 'false'
    secrets:
      - processor_token
    volumes:
      - type: bind
        source: ${ASTER_RELEASE_ROOT:?Set the verified release root}/payload/config/scripts/processor-entrypoint.py
        target: /opt/aster/processor-entrypoint.py
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001
    networks:
      - local-confidential
    healthcheck:
      test:
        - CMD
        - python
        - '-c'
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: ${PROCESSOR_MEMORY:-2g}
    pids_limit: 128
    pull_policy: never
    platform: linux/amd64
    dns:
      - 127.0.0.1
  ollama:
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: ${OLLAMA_IMAGE:?Set verified Ollama image reference}
    user: '10001:10001'
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_QUEUE: '8'
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/ollama
        target: /models
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,size=256m,uid=10001,gid=10001
      - /home/aster:rw,noexec,nosuid,size=8m,uid=10001,gid=10001,mode=0700
    networks:
      - local-confidential
    command:
      - serve
    healthcheck:
      test:
        - CMD
        - /bin/ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: ${OLLAMA_MEMORY:-12g}
    pids_limit: 256
    pull_policy: never
    platform: linux/amd64
    dns:
      - 127.0.0.1
  caddy:
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    user: '10001:10001'
    environment:
      ASTER_DOMAIN: ${ASTER_DOMAIN:?Set appliance DNS hostname}
      ASTER_ORIGIN: ${BETTER_AUTH_URL:?Set the exact public HTTPS origin}
    ports:
      - ${ASTER_BIND_ADDRESS:-0.0.0.0}:${ASTER_HTTP_PORT:-80}:8080
      - ${ASTER_BIND_ADDRESS:-0.0.0.0}:${ASTER_HTTPS_PORT:-443}:8443
    volumes:
      - type: bind
        source: >-
          ${ASTER_RELEASE_ROOT:?Set the verified release
          root}/payload/config/Caddyfile.${ASTER_TLS_MODE:?Choose internal or supplied}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/caddy/data
        target: /data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/caddy/config
        target: /config
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/caddy/tls
        target: /etc/aster/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_RELEASE_ROOT:?Set the verified release root}/payload/config/headers.caddy
        target: /etc/aster/headers.caddy
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - /dev/null
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 64
    pull_policy: never
    platform: linux/amd64
    image: ${CADDY_IMAGE:?Set verified Caddy image reference}
    dns:
      - 127.0.0.1
networks:
  edge:
    internal: true
  database:
    internal: true
  local-confidential:
    internal: true
  mail-egress: {}
  delivery-egress: {}
secrets:
  postgres_password:
    file: ${ASTER_DATA_ROOT:?Set the private appliance data root}/secrets/postgres_password
  migration_password:
    file: ${ASTER_DATA_ROOT:?Set the private appliance data root}/secrets/migration_password
