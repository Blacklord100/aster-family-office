# Standalone appliance profile. Never merge with legacy compose.yaml.
name: ${ASTER_PROJECT_NAME:?Set a unique appliance project name}
services:
  postgres:
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: ${POSTGRES_IMAGE:?Set verified PostgreSQL image reference}
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: aster
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
      - migration_password
      - runtime_password
    volumes:
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/postgres
        target: /var/lib/postgresql/data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_RELEASE_ROOT:?Set the verified release root}/payload/config/postgres/10-roles.sh
        target: /docker-entrypoint-initdb.d/10-roles.sh
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,uid=999,gid=999
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d aster
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    mem_limit: ${POSTGRES_MEMORY:-2g}
    pids_limit: 256
    pull_policy: never
    platform: linux/amd64
    dns:
      - 127.0.0.1
  web:
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: ${ASTER_IMAGE:?Set verified Aster image reference}
    user: '1000:1000'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: aster
      DB_USER: aster_runtime
      DB_PASSWORD_FILE: /run/secrets/db_password
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the exact public HTTPS origin in .env}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      ENCRYPTION_KEYRING_FILE: /run/secrets/encryption_keyring
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-legacy}
      PROCESSOR_TOKEN_FILE: /run/secrets/processor_token
      AUTH_REQUIRE_MFA: 'true'
      AUTH_CLIENT_IP_HEADER: x-real-ip
      PROCESSOR_URL: http://processor:8000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set an operator-approved locally imported model name}
      WORKER_HEARTBEAT_FILE: /run/aster-health/document
      BACKUP_STATUS_FILE: /run/aster-receipts/backup.json
      MAILBOX_PROVIDERS_FILE: /run/secrets/mailbox_providers
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      ASTER_INTAKE_ROOT: /run/aster-intake
      ASTER_ARCHIVE_ROOT: /run/aster-archive
      ARCHIVE_HEARTBEAT_FILE: /run/aster-health/archive
      ALLOW_CLOUD_ENGINES: 'false'
      ASTER_RELEASE_ID: ${ASTER_RELEASE_ID:?Set verified release ID}
      ASTER_SCHEMA_MIN: ${ASTER_SCHEMA_MIN:?Set supported minimum schema}
      ASTER_SCHEMA_MAX: ${ASTER_SCHEMA_MAX:?Set supported maximum schema}
      ASTER_WRITER_GENERATION: ${ASTER_WRITER_GENERATION:?Set active writer generation}
    secrets:
      - source: runtime_password
        target: db_password
      - better_auth_secret
      - encryption_key
      - encryption_keyring
      - processor_token
      - mailbox_providers
    command:
      - node
      - .next/standalone/server.js
    volumes:
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/health
        target: /run/aster-health
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/receipts
        target: /run/aster-receipts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/intake
        target: /run/aster-intake
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASTER_DATA_ROOT:?Set the private appliance data root}/archive
        target: /run/aster-archive
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
      - /app/.next/standalone/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
    networks:
      - edge
      - database
      - local-confidential
    depends_on:
      postgres:
        condition: service_healthy
      processor:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: ${WEB_MEMORY:-1g}
    pids_limit: 128
    pull_policy: never
    platform: linux/amd64
    dns:
      - 127.0.0.1
  worker:
