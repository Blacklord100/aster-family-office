      ALLOW_CLOUD_ENGINES: 'false'
      ASTER_RELEASE_ID: ${ASTER_RELEASE_ID:?Set verified release ID}
      ASTER_SCHEMA_MIN: ${ASTER_SCHEMA_MIN:?Set supported minimum schema}
      ASTER_SCHEMA_MAX: ${ASTER_SCHEMA_MAX:?Set supported maximum schema}
      ASTER_WRITER_GENERATION: ${ASTER_WRITER_GENERATION:?Set active writer generation}
    secrets:
