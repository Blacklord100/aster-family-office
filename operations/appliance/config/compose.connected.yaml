    networks:
      - database
      - local-confidential
    depends_on:
      postgres:
        condition: service_healthy
      processor:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - /opt/aster/worker-healthcheck.mjs
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 150s
    mem_limit: ${WORKER_MEMORY:-1g}
    pids_limit: 128
    pull_policy: never
    platform: linux/amd64
    dns:
      - 127.0.0.1
