name: Verify release
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://aster_runtime:synthetic-ci-runtime-only@127.0.0.1:55439/aster
      MIGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-database-only@127.0.0.1:55439/aster
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_REQUIRE_MFA: 'true'
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: synthetic-ci-database-only
          POSTGRES_DB: aster
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aster"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - name: Backup permission and failure controls with mocked transports
        run: python operations/scripts/test_backup_controls.py
      - run: npm ci
      - run: node scripts/ci-db.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - name: Database lifecycle and isolation
        env:
          APP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          APP_TEST_ADMIN_URL: ${{ env.MIGRATION_DATABASE_URL }}
          AUTH_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          AUTH_TEST_ADMIN_URL: ${{ env.MIGRATION_DATABASE_URL }}
          ASTER_REPORT_OBLIGATIONS_INTEGRATION: '1'
          ASTER_HISTORY_INTEGRATION: '1'
          ASTER_OPERATIONS_INTEGRATION: '1'
          ASTER_RECOVERY_INTEGRATION: '1'
          ASTER_ENGINE_INTEGRATION: '1'
          ASTER_WORKER_INTEGRATION: '1'
          ASTER_WORKER_SCOPE_INTEGRATION: '1'
          ASTER_MAILBOX_INTEGRATION: '1'
          ASTER_FOLDER_INTEGRATION: '1'
          ASTER_ARCHIVE_INTEGRATION: '1'
          ASTER_DEMO_INTEGRATION: '1'
          ASTER_MCP_INTEGRATION: '1'
        run: >-
          node node_modules/vitest/vitest.mjs run --no-file-parallelism
          lib/server/application.integration.test.ts lib/server/auth.integration.test.ts
          lib/server/report-obligations-queue.integration.test.ts
          lib/server/portfolio-history.integration.test.ts
          lib/server/operations.integration.test.ts lib/server/recovery.integration.test.ts
          lib/server/database-role.integration.test.ts
          lib/server/engine.integration.test.ts lib/server/worker-lifecycle.integration.test.ts
          lib/server/worker-scope.test.ts
          lib/server/mailbox.integration.test.ts
          lib/server/folder.integration.test.ts lib/server/demo.integration.test.ts
          lib/server/archive.integration.test.ts
          lib/server/mcp.integration.test.ts
      - name: Processor checks with offline model transports
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          python -m pip install -r processor/requirements.lock.txt
          cd processor
          python -m pytest -q
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format=cyclonedx > release-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: release-sbom.cdx.json
          retention-days: 14
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Validate deployment composition with synthetic secret files
        working-directory: operations
        env:
          BETTER_AUTH_URL: https://synthetic.example.invalid
          OLLAMA_MODEL: synthetic-not-pulled
          OLLAMA_IMAGE: ollama/ollama:synthetic-not-pulled
        run: |
          sh scripts/generate-secrets.sh ./secrets
          docker compose --profile delivery --profile maintenance --profile tls config --quiet
          # Validate the synthetic-only override without mounting mail or starting services.
          aster_demo_intake="$(mktemp -d "${RUNNER_TEMP}/aster-demo-intake.XXXXXX")"
          trap 'rm -rf -- "$aster_demo_intake"' EXIT
          chmod 700 "$aster_demo_intake"
          export ASTER_DEMO_INTAKE_DIR="$aster_demo_intake"
          docker compose -f compose.yaml -f compose.demo.yaml --profile delivery --profile maintenance --profile tls config --quiet
      - name: Build app without application secrets
        id: build_web
        run: docker build -f operations/Dockerfile.app -t aster-web:verify .
      - name: Build processor without application secrets
        id: build_processor
        if: ${{ !cancelled() }}
        run: docker build -f processor/Dockerfile -t aster-processor:verify processor
      - name: Verify app runtime identity and filesystem controls
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' }}
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node aster-web:verify -e "if(process.getuid()===0)process.exit(1);try{require('fs').writeFileSync('/app/forbidden','x');process.exit(1)}catch(e){if(e.code!=='EROFS'&&e.code!=='EACCES')throw e}"
      - name: Verify processor runtime identity
        if: ${{ !cancelled() && steps.build_processor.outcome == 'success' }}
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python aster-processor:verify -c "import os; assert os.getuid()!=0"
      - name: Verify minimal app runtime imports and startup without network
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' }}
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
          --tmpfs /app/.next/standalone/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
          --mount "type=bind,source=${{ github.workspace }}/operations/scripts/probe-app-image.mjs,target=/opt/aster/probe-app-image.mjs,readonly"
          --entrypoint node aster-web:verify /opt/aster/probe-app-image.mjs
      - name: Verify minimal processor runtime and authenticated OCR without network
        if: ${{ !cancelled() && steps.build_processor.outcome == 'success' }}
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
          --mount "type=bind,source=${{ github.workspace }}/operations/scripts/probe-processor-image.py,target=/opt/aster/probe-processor-image.py,readonly"
          --mount "type=bind,source=${{ github.workspace }}/operations/scripts/processor-entrypoint.py,target=/opt/aster/processor-entrypoint.py,readonly"
          --mount "type=bind,source=${{ github.workspace }}/processor/tests,target=/srv/processor/tests,readonly"
          --mount "type=bind,source=${{ github.workspace }}/processor/corpus,target=/srv/processor/corpus,readonly"
          --entrypoint python aster-processor:verify /opt/aster/probe-processor-image.py
      - name: Run full processor regression suite in the built runtime without network
        if: ${{ !cancelled() && steps.build_processor.outcome == 'success' }}
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
          --mount "type=bind,source=${{ github.workspace }}/processor/tests,target=/srv/processor/tests,readonly"
          --mount "type=bind,source=${{ github.workspace }}/processor/corpus,target=/srv/processor/corpus,readonly"
          --entrypoint python aster-processor:verify -m pytest -q -p no:cacheprovider tests
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: ${{ !cancelled() && steps.build_web.outcome == 'success' }}
        with:
          image-ref: aster-web:verify
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: ${{ !cancelled() && steps.build_processor.outcome == 'success' }}
        env:
          TRIVY_LIST_ALL_PKGS: 'true'
        with:
          image-ref: aster-processor:verify
          format: json
          output: processor-image-scan.json
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Verify processor scan includes every retained native package
        if: ${{ !cancelled() && steps.build_processor.outcome == 'success' }}
        run: |
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python aster-processor:verify -c "from pathlib import Path; print(Path('/opt/aster/runtime-manifest.json').read_text())" > processor-runtime-manifest.json
          python3 processor/runtime/verify-scan.py processor-runtime-manifest.json processor-image-scan.json
      - name: Retain processor image security inventory
        if: ${{ !cancelled() && steps.build_processor.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: processor-image-security
          path: |
            processor-runtime-manifest.json
            processor-image-scan.json
          if-no-files-found: error
          retention-days: 14
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: ${{ !cancelled() }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
